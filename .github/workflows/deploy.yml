name: CI/CD Pipeline

on:
  push:
    branches: [development, production]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
        continue-on-error: true

  deploy:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Determine deployment target
        run: |
          if [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "DEPLOY_PATH=/home/subscription-renewal-dev" >> $GITHUB_ENV
            echo "PM2_ENV=development" >> $GITHUB_ENV
            echo "PM2_NAME=asr-dev" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/home/subscription-renewal-prod" >> $GITHUB_ENV
            echo "PM2_ENV=production" >> $GITHUB_ENV
            echo "PM2_NAME=asr" >> $GITHUB_ENV
          fi

      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          PM2_ENV: ${{ env.PM2_ENV }}
          PM2_NAME: ${{ env.PM2_NAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          rsync -az --delete \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".env" \
            --exclude="src/db/database.db*" \
            ./ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH

          ssh $DEPLOY_USER@$DEPLOY_HOST << EOF
            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"

            nvm install 20
            nvm use 20

            echo "=============================="
            echo "USING NODE: \$(node -v)"
            echo "NODE PATH: \$(which node)"
            echo "NPM PATH: \$(which npm)"
            echo "=============================="

            cd $DEPLOY_PATH || exit 1

            if [ ! -f package-lock.json ]; then
              echo "❌ package-lock.json missing"
              exit 1
            fi

            # Remove old native binaries compiled against wrong ABI
            rm -rf node_modules


            # Fresh install using Node 20 ABI
            \$(which npm) ci --omit=dev

            # Rebuild native modules for Node 20
            \$(which npm) rebuild

            # Stop existing processes safely before recreating them from the ecosystem file
            pm2 delete "$PM2_NAME" 2>/dev/null || true
            pm2 delete "Automated Subscription Renewal" 2>/dev/null || true
            pm2 delete "Automated Subscription Renewal Cron" 2>/dev/null || true

            # Start both the web app and cron worker from the PM2 ecosystem config
            NODE_ENV=$PM2_ENV pm2 start ecosystem.config.js --env $PM2_ENV

            pm2 save
          EOF